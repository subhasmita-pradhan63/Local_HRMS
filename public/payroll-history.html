<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payroll History — Inovaantage Payroll Portal</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Inovaantage Payroll</div>
    <nav>
      <a href="/dashboard.html">📊 Dashboard</a>
      <a href="/employees.html">👥 Employees</a>
      <a href="/upload-salary.html">⬆️ Upload Salary</a>
      <a href="/payroll-history.html" class="active">🧾 Payroll History</a>
    </nav>
    <div class="user-box">
      <div class="name" data-user-name>—</div>
      <div class="role" data-user-role>—</div>
      <button class="logout-btn" data-logout>Log Out</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div>
        <button class="hamburger" data-hamburger>☰</button>
        <h1>Payroll History</h1>
        <p>Search past salary records and download payslips as PDF.</p>
      </div>
    </div>

    <div id="alertBox"></div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by Employee ID, Name, or Department...">
        <select id="monthFilter"><option value="">All Months</option></select>
        <input type="number" id="yearFilter" placeholder="Year" style="width:110px;">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Employee Code</th><th>Name</th><th>Department</th><th>Period</th>
              <th>Total Earnings</th><th>Deductions</th><th>Net Salary</th><th>Payslip</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="9" class="empty-state">Loading payroll history...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/js/common.js"></script>
<script src="/js/payroll-history.js"></script>
</body>
</html>
